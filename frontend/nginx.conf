# Serves the static frontend files inside the frontend container.
# The unprivileged nginx image runs as a non-root user, so it listens on 8080.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Always re-check HTML/JS/CSS so a new build shows up on a normal refresh
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
