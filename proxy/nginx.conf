# Reverse proxy: the ONLY container that is published to the host.
# Routes each request to the right module by URL path:
#   /api/courts...        -> courts-api:3001
#   /api/reservations...  -> reservations-api:3002
#   everything else       -> frontend:8080
server {
    listen 8080;
    server_name _;

    # Docker's internal DNS. Using variables in proxy_pass makes nginx look up
    # the container IPs at request time, so the proxy keeps working when
    # Jenkins recreates the other containers during a deployment.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $frontend          http://frontend:8080;
    set $courts_api        http://courts-api:3001;
    set $reservations_api  http://reservations-api:3002;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 1m;

    # Health of the proxy itself (used by its HEALTHCHECK)
    location = /proxy-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/courts {
        proxy_pass $courts_api;
    }

    location /api/reservations {
        proxy_pass $reservations_api;
    }

    location / {
        proxy_pass $frontend;
    }
}
